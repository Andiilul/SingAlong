<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengaturan SingAlong</title>
  <link rel="stylesheet" href="controls.css">
</head>
<body>
  <header class="titlebar">
    <img src="singalong-icon.png" width="24" height="24" alt="">
    <span>SingAlong</span>
    <div class="window-actions">
      <button id="dismiss-settings" class="window-button" type="button" title="Sembunyikan pengaturan" aria-label="Sembunyikan pengaturan"><span class="minimize-icon"></span></button>
    </div>
  </header>
  <main>
    <h1 data-i18n="settingsHeading">Pengaturan overlay</h1>
    <label class="language-row"><span data-i18n="language">Bahasa</span><select id="language"><option value="en">English</option><option value="id">Bahasa Indonesia</option></select></label>
    <p id="language-message" role="status"></p>
    <section class="settings">
      <label class="switch-row">
        <span data-i18n="reduceOpacityOnHover">Redupkan saat kursor di atas lirik</span>
        <input id="reduceOpacityOnHover" class="switch" type="checkbox" role="switch">
      </label>
      <label class="switch-row">
        <span data-i18n="allowClickThrough">Teruskan klik ke aplikasi di belakang</span>
        <input id="allowClickThrough" class="switch" type="checkbox" role="switch">
      </label>
    </section>
    <h2 data-i18n="positionHeading">Posisi</h2>
    <section class="settings">
      <label class="switch-row"><span data-i18n="monitor">Monitor</span><select id="monitorId"></select></label>
      <h3 data-i18n="anchor">Anchor</h3>
      <label class="switch-row">
        <span data-i18n="horizontal">Horizontal</span>
        <select id="horizontalAnchor">
          <option value="left" data-i18n="left">Kiri</option>
          <option value="middle" data-i18n="middle">Tengah</option>
          <option value="right" data-i18n="right">Kanan</option>
        </select>
      </label>
      <label class="switch-row">
        <span data-i18n="vertical">Vertikal</span>
        <select id="verticalAnchor">
          <option value="top" data-i18n="top">Atas</option>
          <option value="middle" data-i18n="middle">Tengah</option>
          <option value="bottom" data-i18n="bottom">Bawah</option>
        </select>
      </label>
      <div id="position-padding">
        <div class="slider-row">
          <label class="slider-label" for="horizontalPadding"><span id="horizontal-padding-label" data-i18n="horizontalPadding">Padding horizontal (px)</span>
          <input id="horizontalPadding" type="number" min="0" max="10000" step="1" value="40">
          </label>
          <input id="horizontalPaddingSlider" data-setting="horizontalPadding" type="range" min="0" max="10000" step="1" value="40" aria-labelledby="horizontal-padding-label">
        </div>
        <div class="slider-row">
          <label class="slider-label" for="verticalPadding"><span id="vertical-padding-label" data-i18n="verticalPadding">Padding vertikal (px)</span>
          <input id="verticalPadding" type="number" min="0" max="10000" step="1" value="40">
          </label>
          <input id="verticalPaddingSlider" data-setting="verticalPadding" type="range" min="0" max="10000" step="1" value="40" aria-labelledby="vertical-padding-label">
        </div>
      </div>
    </section>
    <h2 data-i18n="sizeHeading">Size</h2>
    <section class="settings">
      <div class="slider-row">
        <label class="slider-label" for="fontSize"><span id="fontSize-label" data-i18n="fontSize"></span>
          <input id="fontSize" type="number" min="18" max="48" step="1" value="26">
        </label>
        <input id="fontSizeSlider" data-setting="fontSize" type="range" min="18" max="48" step="1" value="26" aria-labelledby="fontSize-label">
      </div>
      <div class="slider-row">
        <label class="slider-label" for="panelWidth"><span id="panelWidth-label" data-i18n="panelWidth"></span>
          <input id="panelWidth" type="number" min="320" max="1920" step="1" value="680">
        </label>
        <input id="panelWidthSlider" data-setting="panelWidth" type="range" min="320" max="1920" step="1" value="680" aria-labelledby="panelWidth-label">
      </div>
      <div class="slider-row">
        <button id="reset-size" type="button" data-i18n="resetSize">Reset sizes</button>
        <p id="hide-shortcut"></p>
      </div>
    </section>
    <h2 data-i18n="background">Background</h2>
    <section class="settings">
      <label class="switch-row"><span data-i18n="color">Warna</span> <input id="backgroundColor" type="color" value="#0e0f16"></label>
      <div class="slider-row">
        <div class="slider-label">
          <label for="backgroundOpacity" data-i18n="opacity">Opacity</label>
          <output for="backgroundOpacity">78%</output>
        </div>
        <input id="backgroundOpacity" type="range" min="0" max="100" value="78">
      </div>
    </section>
    <h2 data-i18n="text">Teks</h2>
    <section class="settings">
      <label class="switch-row"><span data-i18n="color">Warna</span> <input id="textColor" type="color" value="#ffffff"></label>
      <div class="slider-row">
        <div class="slider-label">
          <label for="textOpacity" data-i18n="opacity">Opacity</label>
          <output for="textOpacity">100%</output>
        </div>
        <input id="textOpacity" type="range" min="0" max="100" value="100">
      </div>
    </section>
    <footer class="credits">Created by Andiilul · 2026<br><button id="github-credit" type="button">GitHub @Andiilul</button></footer>
  </main>
</body>
</html>
