<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SingAlong</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <main>
    <p class="status">Spotify Desktop</p>
    <p class="current">Putar lagu di Spotify Desktop</p>
    <p class="next"></p>
    <div id="playback-controls" class="playback-buttons">
      <button id="previous-track" type="button" aria-label="Lagu sebelumnya" title="Lagu sebelumnya" disabled>⏮</button>
      <button id="play-pause" type="button" aria-label="Putar" title="Putar" disabled>▶</button>
      <button id="next-track" type="button" aria-label="Lagu berikutnya" title="Lagu berikutnya" disabled>⏭</button>
    </div>
    <div class="timeline">
      <span id="elapsed">0:00</span>
      <input id="seek" type="range" min="0" max="1" value="0" step="100" aria-label="Posisi lagu" disabled>
      <span id="duration">0:00</span>
    </div>
    <p id="seek-message" role="status"></p>
  </main>
  <button id="settings-menu" type="button" aria-label="Buka pengaturan" title="Buka pengaturan"><svg stroke="currentColor" fill="none" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false" height="20" width="20" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"></path></svg></button>
  <button id="resync" type="button" aria-label="Sinkronkan ulang Spotify dan lirik" title="Sinkronkan ulang Spotify dan lirik"><svg stroke="currentColor" fill="none" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false" height="20" width="20" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"></path></svg></button>
  <button id="toggle-controller" type="button" aria-label="Sembunyikan kontrol playback" title="Sembunyikan kontrol playback" aria-expanded="true"><svg stroke="currentColor" fill="none" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false" height="20" width="20" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"></path></svg></button>
  <button id="exit-overlay" type="button" aria-label="Exit SingAlong" title="Exit SingAlong"><svg stroke="currentColor" fill="none" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false" height="20" width="20" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1 0 12.728 0M12 3v9"></path></svg></button>
  <aside id="game-notice" role="status" hidden>
    <strong>Mode Game aktif</strong>
    <p>Aktif otomatis saat jendela fullscreen mendapat fokus.</p>
  </aside>
</body>
</html>
